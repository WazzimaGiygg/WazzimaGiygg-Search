function checkAbuse() {

    const now = Date.now();

// ==================== LABIRINTO ====================
const MAZE_SIZE = 21;
let mazeCanvas = null;
let mazeCtx = null;
let mazeWalls = [];
let mazePlayerPos = { x: 0, y: 0 };
let mazeGoalPos = { x: 0, y: 0 };
let mazeStartPos = { x: 0, y: 0 };
let mazeGameActive = true;
let mazeCellSize = 23;

function generateMaze() {
    let grid = Array(MAZE_SIZE).fill().map(() => Array(MAZE_SIZE).fill(true));
    
    let startX = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
    let startY = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
    let goalX = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
    let goalY = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
    
    while(startX === goalX && startY === goalY) {
        goalX = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
        goalY = 1 + Math.floor(Math.random() * ((MAZE_SIZE-2)/2)) * 2;
    }
    
    for(let i = 0; i < MAZE_SIZE; i++) {
        for(let j = 0; j < MAZE_SIZE; j++) {
            if(i % 2 === 1 && j % 2 === 1) {
                grid[i][j] = false;
            }
        }
    }
    
    let walls = [];
    let visited = Array(MAZE_SIZE).fill().map(() => Array(MAZE_SIZE).fill(false));
    visited[startY][startX] = true;
    
    const addWalls = (x, y) => {
        const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
        for(let [dx, dy] of dirs) {
            let nx = x + dx;
            let ny = y + dy;
            if(nx > 0 && nx < MAZE_SIZE-1 && ny > 0 && ny < MAZE_SIZE-1 && !visited[ny][nx]) {
                let wallX = x + dx/2;
                let wallY = y + dy/2;
                walls.push({x: wallX, y: wallY, nextX: nx, nextY: ny});
            }
        }
    };
    
    addWalls(startX, startY);
    
    while(walls.length > 0) {
        let randomIndex = Math.floor(Math.random() * walls.length);
        let wall = walls[randomIndex];
        walls.splice(randomIndex, 1);
        
        let nx = wall.nextX;
        let ny = wall.nextY;
        
        if(!visited[ny][nx]) {
            grid[wall.y][wall.x] = false;
            visited[ny][nx] = true;
            addWalls(nx, ny);
        }
    }
    
    grid[startY][startX] = false;
    grid[goalY][goalX] = false;
    
    for(let i = 0; i < MAZE_SIZE; i++) {
        grid[0][i] = true;
        grid[MAZE_SIZE-1][i] = true;
        grid[i][0] = true;
        grid[i][MAZE_SIZE-1] = true;
    }
    
    grid[startY][startX] = false;
    grid[goalY][goalX] = false;
    
    return {
        walls: grid,
        start: { x: startX, y: startY },
        goal: { x: goalX, y: goalY }
    };
}

function drawMazeGame() {
    if(!mazeCtx) return;
    mazeCtx.clearRect(0, 0, mazeCanvas.width, mazeCanvas.height);
    
    for(let row = 0; row < MAZE_SIZE; row++) {
        for(let col = 0; col < MAZE_SIZE; col++) {
            let x = col * mazeCellSize;
            let y = row * mazeCellSize;
            
            if(mazeWalls[row] && mazeWalls[row][col] === true) {
                mazeCtx.fillStyle = "#5d3a1a";
                mazeCtx.fillRect(x, y, mazeCellSize, mazeCellSize);
                mazeCtx.fillStyle = "#8b5a2b";
                mazeCtx.fillRect(x+2, y+2, mazeCellSize-4, mazeCellSize-4);
            } else {
                let grad = mazeCtx.createLinearGradient(x, y, x+mazeCellSize, y+mazeCellSize);
                grad.addColorStop(0, "#ebd5b3");
                grad.addColorStop(1, "#ddc494");
                mazeCtx.fillStyle = grad;
                mazeCtx.fillRect(x, y, mazeCellSize, mazeCellSize);
            }
        }
    }
    
    mazeCtx.font = `${Math.floor(mazeCellSize * 0.6)}px "Segoe UI"`;
    mazeCtx.fillStyle = "#ffb347";
    mazeCtx.shadowBlur = 2;
    mazeCtx.fillText("⭐", mazeStartPos.x * mazeCellSize + mazeCellSize*0.25, 
                mazeStartPos.y * mazeCellSize + mazeCellSize*0.75);
    
    mazeCtx.fillStyle = "#e34234";
    mazeCtx.fillText("🏁", mazeGoalPos.x * mazeCellSize + mazeCellSize*0.25, 
                mazeGoalPos.y * mazeCellSize + mazeCellSize*0.75);
    
    let px = mazePlayerPos.x * mazeCellSize;
    let py = mazePlayerPos.y * mazeCellSize;
    mazeCtx.beginPath();
    mazeCtx.arc(px + mazeCellSize/2, py + mazeCellSize/2, mazeCellSize*0.3, 0, Math.PI*2);
    mazeCtx.fillStyle = "#4d9eff";
    mazeCtx.fill();
    mazeCtx.beginPath();
    mazeCtx.arc(px + mazeCellSize/2, py + mazeCellSize/2, mazeCellSize*0.2, 0, Math.PI*2);
    mazeCtx.fillStyle = "white";
    mazeCtx.fill();
    mazeCtx.shadowBlur = 0;
}

function mazeMove(dx, dy) {
    if(!mazeGameActive) return;
    
    const newX = mazePlayerPos.x + dx;
    const newY = mazePlayerPos.y + dy;
    
    if(newX < 0 || newX >= MAZE_SIZE || newY < 0 || newY >= MAZE_SIZE) return;
    if(mazeWalls[newY][newX] === true) return;
    
    mazePlayerPos.x = newX;
    mazePlayerPos.y = newY;
    drawMazeGame();
    
    if(mazePlayerPos.x === mazeGoalPos.x && mazePlayerPos.y === mazeGoalPos.y) {
        mazeGameActive = false;
        document.getElementById('mazeStatus').innerHTML = "🎉 PARABÉNS! Acesso liberado! 🎉";
        setTimeout(() => {
            hideCaptcha();
            mazeGameActive = true;
        }, 1500);
    }
}

function initMazeGame() {
    const canvas = document.getElementById('mazeCanvas');
    const container = canvas.parentElement;
    const size = Math.min(container.clientWidth - 40, 500);
    canvas.width = size;
    canvas.height = size;
    mazeCellSize = size / MAZE_SIZE;
    
    mazeCanvas = canvas;
    mazeCtx = canvas.getContext('2d');
    
    const mazeData = generateMaze();
    mazeWalls = mazeData.walls;
    mazePlayerPos = { x: mazeData.start.x, y: mazeData.start.y };
    mazeGoalPos = { x: mazeData.goal.x, y: mazeData.goal.y };
    mazeStartPos = { x: mazeData.start.x, y: mazeData.start.y };
    mazeGameActive = true;
    
    drawMazeGame();
}

// ==================== FUNÇÕES DE UTILIDADE ====================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getTimeAgo(date) {
    if (!date) return '';
    if (date.toDate) date = date.toDate();
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'agora';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h`;
    const days = Math.floor(hours / 24);
    return `${days}d`;
}

function getInitials(name) {
    if (!name) return '?';
    const parts = name.trim().split(' ');
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase();
}

// ==================== NOTIFICAÇÕES ====================

async function loadNotifications() {
    if (!currentUser) return;
    
    try {
        const snapshot = await db.collection('notifications')
            .where('userId', '==', currentUser.uid)
            .orderBy('timestamp', 'desc')
            .limit(50)
            .get();
        
        notifications = [];
        snapshot.forEach(doc => {
            notifications.push({ 
                id: doc.id, 
                ...doc.data(),
                timestamp: doc.data().timestamp || new Date()
            });
        });
        
        notifications.sort((a, b) => {
            const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
            const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
            return dateB - dateA;
        });
        
        unreadCount = notifications.filter(n => !n.lida).length;
        updateNotificationBadge();
        renderNotifications();
        
    } catch (error) {
        console.error('Erro ao carregar notificações:', error);
    }
}

function updateNotificationBadge() {
    const badge = document.getElementById('notifBadge');
    if (unreadCount > 0) {
        badge.style.display = 'flex';
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    } else {
        badge.style.display = 'none';
    }
}

function renderNotifications() {
    const list = document.getElementById('notificationList');
    if (!list) return;
    
    if (notifications.length === 0) {
        list.innerHTML = `
            <div class="notification-empty">
                <span class="material-icons">notifications_off</span>
                <p>Nenhuma notificação</p>
            </div>
        `;
        return;
    }
    
    const recentNotifs = notifications.slice(0, 10);
    
    list.innerHTML = recentNotifs.map(notif => `
        <div class="notification-item ${notif.lida ? '' : 'unread'}" onclick="markAsRead('${notif.id}')">
            <div class="notif-title">${escapeHtml(notif.titulo || 'Notificação')}</div>
            <div class="notif-message">${escapeHtml(notif.mensagem || '')}</div>
            <div class="notif-time">${getTimeAgo(notif.timestamp)}</div>
        </div>
    `).join('');
}

async function markAsRead(notificationId) {
    if (!notificationId) return;
    
    try {
        await db.collection('notifications').doc(notificationId).update({
            lida: true
        });
        
        const notif = notifications.find(n => n.id === notificationId);
        if (notif && !notif.lida) {
            notif.lida = true;
            unreadCount--;
            updateNotificationBadge();
            renderNotifications();
        }
    } catch (error) {
        console.error('❌ Erro ao marcar como lida:', error);
    }
}

async function markAllAsRead(event) {
    if (event) event.stopPropagation();
    
    if (unreadCount === 0) return;
    
    try {
        const batch = db.batch();
        const unreadNotifs = notifications.filter(n => !n.lida);
        
        unreadNotifs.forEach(notif => {
            const ref = db.collection('notifications').doc(notif.id);
            batch.update(ref, { lida: true });
        });
        
        await batch.commit();
        
        notifications.forEach(n => n.lida = true);
        unreadCount = 0;
        updateNotificationBadge();
        renderNotifications();
    } catch (error) {
        console.error('❌ Erro ao marcar todas como lidas:', error);
    }
}

function toggleNotifications(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('notifDropdown');
    if (dropdown) {
        dropdown.classList.toggle('show');
        if (dropdown.classList.contains('show')) {
            loadNotifications();
        }
    }
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.notification-bell')) {
        const dropdown = document.getElementById('notifDropdown');
        if (dropdown) dropdown.classList.remove('show');
    }
});

function listenNotifications() {
    if (notificationListener) {
        notificationListener();
        notificationListener = null;
    }
    
    if (!currentUser) return;
    
    notificationListener = db.collection('notifications')
        .where('userId', '==', currentUser.uid)
        .orderBy('timestamp', 'desc')
        .limit(50)
        .onSnapshot((snapshot) => {
            notifications = [];
            snapshot.forEach(doc => {
                notifications.push({ 
                    id: doc.id, 
                    ...doc.data(),
                    timestamp: doc.data().timestamp || new Date()
                });
            });
            
            notifications.sort((a, b) => {
                const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return dateB - dateA;
            });
            
            unreadCount = notifications.filter(n => !n.lida).length;
            updateNotificationBadge();
            renderNotifications();
        }, (error) => {
            console.error('❌ Erro no listener de notificações:', error);
        });
}

// ==================== FUNÇÕES DE AUTENTICAÇÃO ====================

async function checkIfUserIsBanned(user) {
    if (!user) return false;
    try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
            return userDoc.data().isBanned === true || userDoc.data().isBan === true;
        }
    } catch (error) {
        console.log("Erro ao verificar banimento:", error);
    }
    return false;
}

function showBannedScreen(reason = 'Violação das políticas de uso') {
    const overlay = document.getElementById('bannedOverlay');
    const details = document.getElementById('banDetails');
    details.textContent = `Motivo: ${reason}`;
    overlay.classList.add('show');
    document.querySelector('.header').style.opacity = '0.3';
    document.querySelector('.header').style.pointerEvents = 'none';
    document.querySelector('.container').style.opacity = '0.3';
    document.querySelector('.container').style.pointerEvents = 'none';
    document.querySelector('.site-footer').style.opacity = '0.3';
    document.querySelector('.site-footer').style.pointerEvents = 'none';
}

async function logoutBanned() {
    try {
        await auth.signOut();
        location.reload();
    } catch (error) {
        console.error('Erro ao fazer logout:', error);
        location.reload();
    }
}

async function loginWithGoogle() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;
        
        // Verifica banimento
        isBanned = await checkIfUserIsBanned(currentUser);
        
        if (isBanned) {
            showBannedScreen('Sua conta foi banida por violação das políticas de uso.');
            await auth.signOut();
            updateUI();
            return;
        }
        
        // Verifica se é admin
        isAdmin = false;
        try {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (userDoc.exists && userDoc.data().isAdmin === true) {
                isAdmin = true;
            }
        } catch (e) {}
        
        const userRef = db.collection('users').doc(currentUser.uid);
        const userDoc = await userRef.get();
        
        if (!userDoc.exists) {
            await userRef.set({
                email: currentUser.email,
                displayName: currentUser.displayName || currentUser.email.split('@')[0],
                photoURL: currentUser.photoURL || null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isAdmin: false,
                isTeatcher: false,
                isBanned: false
            });
        }
        
        updateUI();
        closeLoginModal();
        await loadNotifications();
        listenNotifications();
        console.log('✅ Login com Google realizado!');
    } catch (error) {
        console.error('❌ Erro no login:', error);
        alert('Erro ao fazer login: ' + error.message);
    }
}

function updateUI() {
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const userBadge = document.getElementById('userBadge');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const guestBadge = document.getElementById('guest-badge');
    
    if (currentUser && !isBanned) {
        let name = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Usuário');
        
        if (currentUser.photoURL) {
            userAvatar.innerHTML = `<img src="${currentUser.photoURL}" alt="Avatar">`;
        } else {
            userAvatar.textContent = getInitials(name);
        }
        
        userName.textContent = name.length > 20 ? name.substring(0,17)+'...' : name;
        userEmail.textContent = currentUser.email || '';
        
        let badges = '';
        if (isBanned) badges += '<span class="badge-banned">🚫 Banido</span> ';
        if (isAdmin) badges += '<span class="badge-admin">Admin</span> ';
        userBadge.innerHTML = badges;
        
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        if (guestBadge) {
            guestBadge.innerHTML = `<i class="material-icons" style="font-size:14px;">person</i> Olá, ${escapeHtml(name)}`;
        }
    } else {
        userAvatar.innerHTML = '👤';
        userName.textContent = 'Visitante';
        userEmail.textContent = '';
        userBadge.innerHTML = '';
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        if (guestBadge) {
            guestBadge.innerHTML = `<i class="material-icons" style="font-size:14px;">public</i> Modo Convidado - Busca liberada`;
        }
    }
}

function showLoginModal() { document.getElementById('login-modal').classList.add('show'); }
function closeLoginModal() { document.getElementById('login-modal').classList.remove('show'); }

// ==================== FUNÇÃO DE LOGOUT CORRIGIDA ====================
async function logout() {
    try {
        // Desloga do Firebase
        await auth.signOut();
        
        // Reseta variáveis
        currentUser = null;
        isBanned = false;
        isAdmin = false;
        
        // Limpa listener de notificações
        if (notificationListener) {
            notificationListener();
            notificationListener = null;
        }
        notifications = [];
        unreadCount = 0;
        updateNotificationBadge();
        
        // Atualiza UI
        updateUI();
        
        console.log('✅ Logout realizado com sucesso!');
    } catch (error) {
        console.error('❌ Erro no logout:', error);
        alert('Erro ao sair: ' + error.message);
    }
}

    const email = prompt('Digite seu e-mail:');
    if (!email) return;
    const password = prompt('Digite sua senha (mínimo 6 caracteres):');
    if (!password || password.length < 6) {
        alert('A senha deve ter pelo menos 6 caracteres');
        return;
    }
    registerUserEmail(email, password);
}

async function registerUserEmail(email, password) {
    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        await db.collection('users').doc(currentUser.uid).set({
            email: currentUser.email,
            displayName: currentUser.email.split('@')[0],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isAdmin: false,
            isTeatcher: false,
            isBanned: false
        });
        updateUI();
        closeLoginModal();
        alert('Conta criada com sucesso!');
    } catch (error) {
        console.error('❌ Erro ao criar conta:', error);
        alert('Erro ao criar conta: ' + error.message);
    }
}

// ==================== FUNÇÕES DA BUSCA ====================
let allPages = [];
let searchTimeout = null;

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-search');
const suggestionsDiv = document.getElementById('suggestions');
const resultsContainer = document.getElementById('results-container');
const resultsGrid = document.getElementById('results-grid');
const resultsCount = document.getElementById('results-count');
const pageCountSpan = document.getElementById('page-count');

async function loadAllPages() {
    try {
        console.log('📚 Carregando páginas do Firebase...');
        const querySnapshot = await db.collection('paginasUsuario').get();
        allPages = [];
        
        querySnapshot.forEach(doc => {
            const data = doc.data();
            const pages = data["Lista de Páginas de Busca"] || [];
            
            pages.forEach(page => {
                if (page.Nome && page.Link) {
                    allPages.push({
                        id: page.id || generateId(),
                        nome: page.Nome,
                        url: page.Link,
                        categoria: page.categoria || 'Geral',
                        icone: page.icone || 'link',
                        descricao: page.descricao || '',
                        usuarioId: doc.id,
                        ordem: page.ordem || 0
                    });
                }
            });
        });
        
        const urlMap = new Map();
        allPages = allPages.filter(page => {
            if (urlMap.has(page.url)) return false;
            urlMap.set(page.url, true);
            return true;
        });
        
        pageCountSpan.textContent = allPages.length;
        console.log(`✅ ${allPages.length} páginas carregadas`);
        return allPages;
    } catch (error) {
        console.error('❌ Erro ao carregar páginas:', error);
        return [];
    }
}

function searchPages(query) {
    if (!query || query.trim() === '') return [];
    const lowerQuery = query.toLowerCase();
    return allPages.filter(page => {
        return page.nome.toLowerCase().includes(lowerQuery) ||
               page.descricao.toLowerCase().includes(lowerQuery) ||
               page.categoria.toLowerCase().includes(lowerQuery) ||
               page.url.toLowerCase().includes(lowerQuery);
    });
}

function showSuggestions(query) {
    if (!query || query.trim() === '') {
        suggestionsDiv.classList.remove('show');
        return;
    }
    
    const results = searchPages(query).slice(0, 5);
    if (results.length === 0) {
        suggestionsDiv.classList.remove('show');
        return;
    }
    
    suggestionsDiv.innerHTML = results.map(page => `
        <div class="suggestion-item" onclick="selectSuggestion('${page.nome.replace(/'/g, "\\'")}')">
            <i class="material-icons suggestion-icon">${page.icone}</i>
            <div class="suggestion-text">
                <strong>${highlightText(page.nome, query)}</strong>
                <div style="font-size: 12px; color: #5f6368;">${page.url.substring(0, 50)}</div>
            </div>
            <span class="suggestion-category">${page.categoria}</span>
        </div>
    `).join('');
    suggestionsDiv.classList.add('show');
}

function highlightText(text, query) {
    if (!query) return text;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark style="background: #fff3cd; padding: 0;">$1</mark>');
}

function selectSuggestion(query) {
    searchInput.value = query;
    suggestionsDiv.classList.remove('show');
    performSearch();
}

async function performSearch() {
    if (isCaptchaActive) {
        alert("Complete o labirinto de verificação primeiro!");
        return;
    }
    
    if (!checkAbuse()) return;
    
    const query = searchInput.value.trim();
    if (!query) {
        showAllPages();
        return;
    }
    
    const results = searchPages(query);
    displayResults(results, query);
}

async function showAllPages() {
    if (isCaptchaActive) {
        alert("Complete o labirinto de verificação primeiro!");
        return;
    }
    
    if (!checkAbuse()) return;
    
    const query = searchInput.value.trim();
    if (query) searchInput.value = '';
    displayResults(allPages, 'Todos os resultados');
}

function displayResults(results, searchTerm) {
    resultsCount.textContent = `📄 ${results.length} resultado${results.length !== 1 ? 's' : ''} para "${searchTerm || 'todos'}"`;
    
    if (results.length === 0) {
        resultsGrid.innerHTML = `
            <div class="no-results" style="grid-column: 1/-1;">
                <i class="material-icons">search_off</i>
                <h3>Nenhum resultado encontrado</h3>
                <p>Tente buscar por outro termo ou verifique a ortografia.</p>
            </div>
        `;
    } else {
        resultsGrid.innerHTML = results.map(page => `
            <div class="result-card" onclick="window.open('${page.url}', '_blank')">
                <div class="card-icon">
                    <i class="material-icons">${page.icone}</i>
                </div>
                <h3 class="card-title">${escapeHtml(page.nome)}</h3>
                <div class="card-url">${escapeHtml(page.url)}</div>
                ${page.descricao ? `<div class="card-description">${escapeHtml(page.descricao.substring(0, 100))}${page.descricao.length > 100 ? '...' : ''}</div>` : ''}
                <span class="card-category">${escapeHtml(page.categoria)}</span>
            </div>
        `).join('');
    }
    
    resultsContainer.classList.add('show');
    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function hideResults() {
    resultsContainer.classList.remove('show');
}

function resetSearch() {
    searchInput.value = '';
    hideResults();
    suggestionsDiv.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function generateId() {
    return 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

// ==================== EVENT LISTENERS ====================
searchInput.addEventListener('input', (e) => {
    const query = e.target.value;
    clearBtn.style.display = query ? 'flex' : 'none';
    if (searchTimeout) clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => showSuggestions(query), 300);
});

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    suggestionsDiv.classList.remove('show');
    searchInput.focus();
});

searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        suggestionsDiv.classList.remove('show');
        performSearch();
    }
});

document.getElementById('search-button').addEventListener('click', () => {
    suggestionsDiv.classList.remove('show');
    performSearch();
});

document.getElementById('login-form-modal').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('modal-email').value;
    const password = document.getElementById('modal-password').value;
    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        updateUI();
        closeLoginModal();
        console.log('✅ Login realizado!');
    } catch (error) {
        console.error('❌ Erro no login:', error);
        alert('Erro ao fazer login: ' + error.message);
    }
});

// Fechar modal ao clicar fora
const loginModal = document.getElementById('login-modal');
loginModal.addEventListener('click', (e) => {
    if (e.target === loginModal) closeLoginModal();
});

// Controles do labirinto com teclado
document.addEventListener('keydown', (e) => {
    if (!isCaptchaActive) return;
    
    let dx = 0, dy = 0;
    if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
    else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
    else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
    else return;
    
    e.preventDefault();
    mazeMove(dx, dy);
});

// ==================== INICIALIZAÇÃO ====================
async function init() {
    await loadAllPages();
    
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            
            // Verifica banimento
            isBanned = await checkIfUserIsBanned(user);
            
            if (isBanned) {
                showBannedScreen('Sua conta foi banida por violação das políticas de uso.');
                await auth.signOut();
                updateUI();
                return;
            }
            
            // Verifica se é admin
            isAdmin = false;
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().isAdmin === true) {
                    isAdmin = true;
                }
            } catch (e) {}
            
            updateUI();
            await loadNotifications();
            listenNotifications();
        } else {
            currentUser = null;
            isBanned = false;
            isAdmin = false;
            updateUI();
            if (notificationListener) {
                notificationListener();
                notificationListener = null;
            }
            notifications = [];
            unreadCount = 0;
            updateNotificationBadge();
        }
    });
    
    console.log('🚀 WazzimaGiygg Search inicializado com proteção Anti-Abuse!');
    console.log('📝 Proteção: ' + MAX_ACCESS_IN_WINDOW + ' acessos a cada ' + TIME_WINDOW_MS/1000 + ' segundos');
    console.log('🔔 Notificações integradas via coleção "notifications"');
}

init();
</script>
